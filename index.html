<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission 30 Mai — La Brigade</title>
    <meta name="description" content="Tonton Paul a préparé une surprise exceptionnelle. Rose, Gustave et Jacques doivent réussir les missions, débloquer les indices et ouvrir le coffre final." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mission 30 Mai — La Brigade" />
    <meta property="og:description" content="Une mission secrète, des indices, un coffre final… et une surprise exceptionnelle préparée par Tonton Paul." />
    <meta property="og:url" content="https://test-ok-three.vercel.app/" />
    <meta property="og:image" content="https://test-ok-three.vercel.app/mission-hero.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mission 30 Mai — La Brigade" />
    <meta name="twitter:description" content="Réussissez les missions, débloquez les indices et ouvrez le coffre final." />
    <meta name="twitter:image" content="https://test-ok-three.vercel.app/mission-hero.png" />
    <link rel="stylesheet" href="/mission-hero.css" />
  </head>
  <body>
    <script>
      (function(){
        var params = new URLSearchParams(window.location.search);
        if(params.get('unlock') === '1'){
          localStorage.setItem('brigade30mai', JSON.stringify({ rose: 320, gustave: 320, jacques: 320 }));
          sessionStorage.removeItem('mission30-victory-played-v1');
        }
        if(params.get('reset') === '1'){
          localStorage.removeItem('brigade30mai');
          sessionStorage.removeItem('mission30-victory-played-v1');
        }
      })();
    </script>
    <div id="root"></div>
    <script>
      (function(){
        var armed = false;
        var playedKey = 'mission30-victory-played-v1';
        function arm(){ armed = true; }
        ['click','touchstart','keydown'].forEach(function(evt){ window.addEventListener(evt, arm, { once:false, passive:true }); });
        function shouldPlay(){
          var text = document.body ? document.body.innerText || '' : '';
          return text.indexOf('Coffre ouvert') !== -1 || text.indexOf('Surprise de Tonton Paul') !== -1;
        }
        function playVictory(){
          if(!armed || sessionStorage.getItem(playedKey) === '1' || !shouldPlay()) return;
          sessionStorage.setItem(playedKey,'1');
          var audio = new Audio('/victory.mp3');
          audio.volume = 0.9;
          audio.play().catch(function(){ sessionStorage.removeItem(playedKey); });
        }
        new MutationObserver(playVictory).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
        window.addEventListener('load', function(){ setTimeout(playVictory, 500); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
